services:
  db:
    image: postgres:16-alpine
    container_name: quizreto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sql}
      POSTGRES_DB: ${POSTGRES_DB:-quizreto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-quizreto}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quizreto-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizreto-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-sql}@db:5432/${POSTGRES_DB:-quizreto}
      SECRET_KEY: ${SECRET_KEY:-Ez_lMlp2a6JMJHgCait9nmvHYiSvrUeN7pBh1pqFLlw}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - quizreto-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quizreto-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - quizreto-net

volumes:
  postgres_data:
    driver: local

networks:
  quizreto-net:
    driver: bridge
